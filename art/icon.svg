<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bezel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3d590"/>
      <stop offset="0.3" stop-color="#b98a3e"/>
      <stop offset="0.7" stop-color="#6e4518"/>
      <stop offset="1" stop-color="#3a2108"/>
    </linearGradient>
    <linearGradient id="bezelIn" x1="0.8" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#d9ab5c"/>
      <stop offset="0.55" stop-color="#7a4c1a"/>
      <stop offset="1" stop-color="#2e1806"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="62%" r="60%">
      <stop offset="0" stop-color="#173452"/>
      <stop offset="0.55" stop-color="#0c1d31"/>
      <stop offset="1" stop-color="#040910"/>
    </radialGradient>
    <radialGradient id="pinGold" cx="36%" cy="22%" r="80%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.2" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#f2a516"/>
      <stop offset="1" stop-color="#8a4600"/>
    </radialGradient>
    <radialGradient id="socket" cx="50%" cy="38%" r="64%">
      <stop offset="0" stop-color="#1d3d5e"/>
      <stop offset="1" stop-color="#050e19"/>
    </radialGradient>
    <linearGradient id="markGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.5" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#e48a06"/>
    </linearGradient>
    <linearGradient id="beamX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffdc78" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#ffdc78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="beamFade" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="42" width="512" height="340" fill="url(#fadeUp)"/>
    </mask>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffc83a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffc83a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur16" x="-80%" y="-10%" width="260%" height="120%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur5" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="inside">
      <circle cx="256" cy="256" r="214"/>
    </clipPath>
  </defs>

  <!-- bezel, antique bronze so the pin carries the gold -->
  <circle cx="256" cy="256" r="251" fill="#1c0e02"/>
  <circle cx="256" cy="256" r="245" fill="url(#bezel)"/>
  <circle cx="256" cy="256" r="226" fill="url(#bezelIn)"/>
  <circle cx="256" cy="256" r="219" fill="#1c0e02"/>
  <circle cx="256" cy="256" r="214" fill="url(#field)"/>

  <g clip-path="url(#inside)">
    <!-- compass rose, recessed into the field -->
    <g opacity="0.95">
      <path d="M256 126 L256 256 L242 242 Z" fill="#234263" transform="rotate(45 256 256)"/>
      <path d="M256 126 L256 256 L242 242 Z" fill="#234263" transform="rotate(135 256 256)"/>
      <path d="M256 126 L256 256 L242 242 Z" fill="#234263" transform="rotate(225 256 256)"/>
      <path d="M256 126 L256 256 L242 242 Z" fill="#234263" transform="rotate(315 256 256)"/>
      <path d="M256 126 L256 256 L270 242 Z" fill="#102236" transform="rotate(45 256 256)"/>
      <path d="M256 126 L256 256 L270 242 Z" fill="#102236" transform="rotate(135 256 256)"/>
      <path d="M256 126 L256 256 L270 242 Z" fill="#102236" transform="rotate(225 256 256)"/>
      <path d="M256 126 L256 256 L270 242 Z" fill="#102236" transform="rotate(315 256 256)"/>
      <path d="M256 64 L256 256 L234 234 Z" fill="#2e4f72" transform="rotate(0 256 256)"/>
      <path d="M256 64 L256 256 L234 234 Z" fill="#2e4f72" transform="rotate(90 256 256)"/>
      <path d="M256 64 L256 256 L234 234 Z" fill="#2e4f72" transform="rotate(180 256 256)"/>
      <path d="M256 64 L256 256 L234 234 Z" fill="#2e4f72" transform="rotate(270 256 256)"/>
      <path d="M256 64 L256 256 L278 234 Z" fill="#14283d" transform="rotate(0 256 256)"/>
      <path d="M256 64 L256 256 L278 234 Z" fill="#14283d" transform="rotate(90 256 256)"/>
      <path d="M256 64 L256 256 L278 234 Z" fill="#14283d" transform="rotate(180 256 256)"/>
      <path d="M256 64 L256 256 L278 234 Z" fill="#14283d" transform="rotate(270 256 256)"/>
    </g>
    <!-- ticks; the four cardinals are left as gaps -->
    <g stroke="#7d6640" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M256 52 L256 60" transform="rotate(11.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(22.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(33.75 256 256)"/>
      <path d="M256 50 L256 64" transform="rotate(45.0 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(56.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(67.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(78.75 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(101.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(112.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(123.75 256 256)"/>
      <path d="M256 50 L256 64" transform="rotate(135.0 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(146.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(157.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(168.75 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(191.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(202.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(213.75 256 256)"/>
      <path d="M256 50 L256 64" transform="rotate(225.0 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(236.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(247.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(258.75 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(281.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(292.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(303.75 256 256)"/>
      <path d="M256 50 L256 64" transform="rotate(315.0 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(326.25 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(337.5 256 256)"/>
      <path d="M256 52 L256 60" transform="rotate(348.75 256 256)"/>
    </g>

    <!-- the beacon: wide soft halo, then a bright core fading upward -->
    <g mask="url(#beamFade)">
      <rect x="190" y="20" width="132" height="370" fill="#ffcf4a" opacity="0.6" filter="url(#blur16)"/>
      <rect x="220" y="20" width="72" height="370" fill="url(#beamX)"/>
      <rect x="250" y="20" width="12" height="370" fill="#fffdf2" opacity="0.5" filter="url(#blur5)"/>
    </g>

    <!-- where the beam meets the ground -->
    <ellipse cx="256" cy="378" rx="160" ry="46" fill="url(#pool)"/>
    <ellipse cx="256" cy="378" rx="106" ry="29" fill="none" stroke="#ffc83a" stroke-width="12" filter="url(#blur5)"/>
    <ellipse cx="256" cy="378" rx="106" ry="29" fill="none" stroke="#fff0b8" stroke-width="5"/>
    <ellipse cx="256" cy="378" rx="30" ry="8" fill="#fff6d0" filter="url(#blur5)"/>

    <!-- motes -->
    <g fill="#fff3c4">
      <circle cx="228" cy="104" r="3.5" opacity="0.85"/>
      <circle cx="288" cy="78" r="2.5" opacity="0.7"/>
      <circle cx="302" cy="146" r="3" opacity="0.6"/>
      <circle cx="212" cy="166" r="2" opacity="0.55"/>
    </g>
  </g>

  <!-- the pin -->
  <g transform="translate(256 376) scale(1.12) translate(-256 -370)">
    <path d="M256 368 C247 344 236 312 214 300 A86 86 0 1 1 298 300 C276 312 265 344 256 368 Z" fill="url(#pinGold)" stroke="#1c0e02" stroke-width="9" stroke-linejoin="round"/>
    <path d="M186 214 A70 70 0 0 1 236 156" fill="none" stroke="#fffbe8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <g transform="translate(256 228) scale(1.25) translate(-256 -228)">
      <path d="M235 204 A21 21 0 1 1 269 221 C260 227 256 232 256 243" fill="none" stroke="#fff2b0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5 2.5)" opacity="0.8"/>
      <circle cx="257.5" cy="264.5" r="9.5" fill="#fff2b0" opacity="0.8"/>
      <path d="M235 204 A21 21 0 1 1 269 221 C260 227 256 232 256 243" fill="none" stroke="#3a1c00" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="256" cy="262" r="9.5" fill="#3a1c00"/>
    </g>
  </g>
</svg>
