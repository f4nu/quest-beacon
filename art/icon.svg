<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bezel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3d590"/>
      <stop offset="0.3" stop-color="#b98a3e"/>
      <stop offset="0.7" stop-color="#6e4518"/>
      <stop offset="1" stop-color="#3a2108"/>
    </linearGradient>
    <linearGradient id="bezelIn" x1="0.8" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#d9ab5c"/>
      <stop offset="0.55" stop-color="#7a4c1a"/>
      <stop offset="1" stop-color="#2e1806"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1c3f63"/>
      <stop offset="0.55" stop-color="#0e223b"/>
      <stop offset="1" stop-color="#050b14"/>
    </radialGradient>
    <radialGradient id="pinGold" cx="36%" cy="22%" r="80%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.2" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#f2a516"/>
      <stop offset="1" stop-color="#8a4600"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffc83a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc83a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="inside">
      <circle cx="256" cy="256" r="214"/>
    </clipPath>
  </defs>

  <!-- bezel: the family's antique bronze -->
  <circle cx="256" cy="256" r="251" fill="#1c0e02"/>
  <circle cx="256" cy="256" r="245" fill="url(#bezel)"/>
  <circle cx="256" cy="256" r="226" fill="url(#bezelIn)"/>
  <circle cx="256" cy="256" r="219" fill="#1c0e02"/>
  <circle cx="256" cy="256" r="214" fill="url(#field)"/>

  <g clip-path="url(#inside)">
    <!-- compass rose, recessed into the dial; each point is a lit and a shaded half -->
    <g transform="translate(256 256)">
      <g fill="#1f4468"><path d="M0 -110 L16 -16 L0 0 Z" transform="rotate(45)"/><path d="M0 -110 L16 -16 L0 0 Z" transform="rotate(135)"/><path d="M0 -110 L16 -16 L0 0 Z" transform="rotate(225)"/><path d="M0 -110 L16 -16 L0 0 Z" transform="rotate(315)"/></g>
      <g fill="#0a1828"><path d="M0 -110 L-16 -16 L0 0 Z" transform="rotate(45)"/><path d="M0 -110 L-16 -16 L0 0 Z" transform="rotate(135)"/><path d="M0 -110 L-16 -16 L0 0 Z" transform="rotate(225)"/><path d="M0 -110 L-16 -16 L0 0 Z" transform="rotate(315)"/></g>
      <g fill="#33679a"><path d="M0 -196 L24 -24 L0 0 Z"/><path d="M0 -196 L24 -24 L0 0 Z" transform="rotate(90)"/><path d="M0 -196 L24 -24 L0 0 Z" transform="rotate(180)"/><path d="M0 -196 L24 -24 L0 0 Z" transform="rotate(270)"/></g>
      <g fill="#122c4a"><path d="M0 -196 L-24 -24 L0 0 Z"/><path d="M0 -196 L-24 -24 L0 0 Z" transform="rotate(90)"/><path d="M0 -196 L-24 -24 L0 0 Z" transform="rotate(180)"/><path d="M0 -196 L-24 -24 L0 0 Z" transform="rotate(270)"/></g>
    </g>
    <!-- ticks; the cardinals are left to the rose -->
    <g stroke="#b8945a" stroke-width="6" stroke-linecap="round" opacity="0.75">
      <path d="M256 48 L256 76" transform="rotate(30 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(60 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(120 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(150 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(210 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(240 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(300 256 256)"/>
      <path d="M256 48 L256 76" transform="rotate(330 256 256)"/>
    </g>

    <!-- the other quests, further off and greyed, like on the bar -->
    <g opacity="0.7">
      <g transform="translate(148 180) scale(0.56)">
        <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="#1c0e02" stroke="#1c0e02" stroke-width="18" stroke-linejoin="round"/>
        <circle cx="0" cy="46" r="26" fill="#1c0e02"/>
        <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="#6f8299"/>
        <circle cx="0" cy="46" r="17" fill="#6f8299"/>
      </g>
      <g transform="translate(374 338) scale(0.56)">
        <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="#1c0e02" stroke="#1c0e02" stroke-width="18" stroke-linejoin="round"/>
        <circle cx="0" cy="46" r="26" fill="#1c0e02"/>
        <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="#6f8299"/>
        <circle cx="0" cy="46" r="17" fill="#6f8299"/>
      </g>
    </g>

    <!-- the beacon's light -->
    <circle cx="308" cy="166" r="112" fill="url(#halo)"/>

    <!-- the needle: red end on the quest, cream end away; the pivot sits
         down-left of the dial's centre so the tip lands on the mark -->
    <g transform="translate(212 332) rotate(39.9)">
      <path d="M0 -124 L46 0 L0 118 L-46 0 Z" fill="#1c0e02" stroke="#1c0e02" stroke-width="16" stroke-linejoin="round" transform="translate(7 9)" opacity="0.45"/>
      <path d="M0 -124 L46 0 L0 118 L-46 0 Z" fill="#1c0e02" stroke="#1c0e02" stroke-width="16" stroke-linejoin="round"/>
      <path d="M0 -124 L0 0 L-46 0 Z" fill="#ff6a5a"/>
      <path d="M0 -124 L0 0 L46 0 Z" fill="#c41a14"/>
      <path d="M0 118 L0 0 L-46 0 Z" fill="#fffdf2"/>
      <path d="M0 118 L0 0 L46 0 Z" fill="#c9bfa8"/>
      <path d="M-46 0 L46 0" stroke="#1c0e02" stroke-width="7"/>
      <circle cx="0" cy="0" r="23" fill="#1c0e02"/>
      <circle cx="0" cy="0" r="15" fill="url(#bezel)"/>
      <circle cx="-5" cy="-5" r="4.5" fill="#fffbe8" opacity="0.75"/>
    </g>

    <!-- the quest the needle brings you to: a gold "!" in its own light -->
    <g transform="translate(308 162) scale(1.2)">
      <circle cx="0" cy="-4" r="52" fill="#ffd35a" opacity="0.55" filter="url(#blur14)"/>
      <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="#1c0e02" stroke="#1c0e02" stroke-width="18" stroke-linejoin="round" transform="translate(5 7)" opacity="0.4"/>
      <circle cx="5" cy="53" r="26" fill="#1c0e02" opacity="0.4"/>
      <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="#1c0e02" stroke="#1c0e02" stroke-width="18" stroke-linejoin="round"/>
      <circle cx="0" cy="46" r="26" fill="#1c0e02"/>
      <path d="M-19 -66 L19 -66 L13 8 L-13 8 Z" fill="url(#pinGold)"/>
      <circle cx="0" cy="46" r="17" fill="url(#pinGold)"/>
      <path d="M-13 -58 L-9 -2" stroke="#fffbe8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="-5" cy="41" r="5" fill="#fffbe8" opacity="0.7"/>
    </g>
  </g>
</svg>
